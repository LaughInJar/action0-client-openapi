openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
servers:
- url: https://petstore.example.com/{basePath}
  variables:
    basePath:
      default: v1
security:
- BearerAuth: []
- LegacyOAuth: []
paths:
  /pets:
    get:
      operationId: listPets
      tags:
      - pets
      summary: List all pets.
      parameters:
      - name: limit
        in: query
        description: How many pets to return at most. The server caps this at 100;
          anything above is silently reduced to the first hundred matches.
        schema:
          type: integer
          default: 20
      - name: tags
        in: query
        schema:
          type: array
          items:
            type: string
      - name: X-Request-Id
        in: header
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: the pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      tags:
      - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  description: The pet's display name.
                tag:
                  type: string
      responses:
        '201':
          description: the new pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{petId}:
    parameters:
    - name: petId
      in: path
      required: true
      description: The identifier of the pet to operate on.
      schema:
        type: integer
    get:
      operationId: getPet
      tags:
      - pets
      responses:
        '200':
          description: the pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    put:
      operationId: replacePet
      tags:
      - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: the stored pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      operationId: deletePet
      tags:
      - pets
      responses:
        '204':
          description: the pet is gone
  /pets/{petId}/photo:
    put:
      operationId: uploadPetPhoto
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: photo stored
    get:
      operationId: getPetPhoto
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: the photo
          content:
            image/png:
              schema:
                type: string
                format: binary
  /store/inventory:
    get:
      operationId: getInventory
      summary: Returns pet quantities by status.
      responses:
        '200':
          description: the inventory
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
  /oauth/token:
    post:
      operationId: createToken
      tags:
      - auth
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              properties:
                grant_type:
                  type: string
                  description: The OAuth grant type.
                scope:
                  type: string
      responses:
        '200':
          description: the token
          content:
            application/json:
              schema:
                type: object
                required:
                - access_token
                properties:
                  access_token:
                    type: string
                    description: The bearer token to present in the Authorization
                      header.
                  expires_in:
                    type: integer
components:
  schemas:
    Pet:
      type: object
      description: One pet of the store.
      required:
      - id
      - name
      properties:
        id:
          type: integer
          format: int64
          description: The pet's unique identifier.
        name:
          type: string
        status:
          $ref: '#/components/schemas/PetStatus'
        bornOn:
          type: string
          format: date
          nullable: true
          description: |-
            The pet's day of birth.

            Unknown for pets rescued from the wild.
        owner:
          $ref: '#/components/schemas/Owner'
        labels:
          type: object
          additionalProperties:
            type: string
        friends:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        companion:
          $ref: '#/components/schemas/Companion'
    Companion:
      description: A pet's companion animal.
      oneOf:
      - $ref: '#/components/schemas/Cat'
      - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: species
        mapping:
          cat: '#/components/schemas/Cat'
    Cat:
      allOf:
      - $ref: '#/components/schemas/Animal'
      - type: object
        required:
        - meow
        properties:
          meow:
            type: boolean
    Dog:
      allOf:
      - $ref: '#/components/schemas/Animal'
      - type: object
        required:
        - bark
        properties:
          bark:
            type: boolean
    Animal:
      type: object
      required:
      - species
      - name
      properties:
        species:
          type: string
        name:
          type: string
    PetStatus:
      type: string
      description: The pet's sale status.
      enum:
      - available
      - on-sale
      - sold
    Owner:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        class:
          type: string
    HealthRecord:
      type: object
      description: One veterinary examination of a pet.
      required:
      - examinedOn
      - clinic
      properties:
        examinedOn:
          type: string
          format: date
          nullable: true
          description: The day of the examination. Null when it is not recorded.
        clinic:
          type: string
        notes:
          type: string
      additionalProperties:
        type: number
        description: Measured values by name (weight, temperature, ...).
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    ApiKeyAuth:
      type: apiKey
      in: query
      name: api_key
    LegacyOAuth:
      type: oauth2
      flows: {}
